services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanshield
      POSTGRES_USER: scanshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanshield -d scanshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scanshield:${POSTGRES_PASSWORD}@database:5432/scanshield
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  retention:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scanshield:${POSTGRES_PASSWORD}@database:5432/scanshield
    command: ["sh", "-c", "sleep 60; while true; do python -m app.cli purge; sleep 3600; done"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  database-data:
