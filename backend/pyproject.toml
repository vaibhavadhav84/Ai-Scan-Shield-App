[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-shield-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy==2.0.48",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "scikit-learn==1.6.1", "scipy==1.15.3",
  "numpy==2.2.6", "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]
voice = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
