name: quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: pip install -e 'backend[dev]'
      - run: ruff check backend ml scripts
      - run: ruff format --check backend ml scripts
      - run: pytest -q
        working-directory: backend
      - run: pip-audit -r backend/requirements.lock
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
      - run: flutter pub get
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
